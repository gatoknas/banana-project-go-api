name: Swagger docs check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  swagger-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate swagger docs
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/api/main.go -o docs

      - name: Fail on drift
        run: git diff --exit-code docs/
