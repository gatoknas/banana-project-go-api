name: TDT gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  tdt-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run TDT gate
        run: go run ./cmd/testgate -base origin/main
