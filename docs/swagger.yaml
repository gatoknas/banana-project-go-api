  /hello:
    get:
      description: Returns a simple web page with the centered logo and "hecho en
        Colombia" footer.
      produces:
      - text/html
      responses:
        "200":
          description: HTML page
          schema:
            type: string
      summary: Hello Endpoint Web Page
      tags:
      - system
  /hello/logo.png:
    get:
      description: Returns the embedded Ayurami logo image bytes.
      produces:
      - image/png
      responses:
        "200":
          description: logo image bytes
          schema:
            type: string
      summary: Logo image
      tags:
      - system
  /login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns a JWT token.
      parameters:
      - description: User Credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: 'Bad request: invalid JSON payload or missing username'
          schema:
            type: string
        "401":
          description: 'Unauthorized: invalid credentials'
          schema:
            type: string
        "403":
          description: 'Forbidden: account is inactive'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: User Login
      tags:
      - auth
  /refresh:
    post:
      consumes:
      - application/json
      description: Generates a new token pair using a valid refresh token.
      parameters:
      - description: Refresh Token
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "401":
          description: 'Unauthorized: invalid refresh token'
          schema:
            type: string
      summary: Refresh JWT Token
      tags:
      - auth
  /status:
    get:
      description: Checks if the API is running and verifies connection to the database.
      produces:
      - application/json
      responses:
        "200":
          description: Status OK
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: System Health Status
      tags:
      - system
securityDefinitions:
  BearerAuth:
    description: Type "Bearer " followed by the JWT obtained from POST /login.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
