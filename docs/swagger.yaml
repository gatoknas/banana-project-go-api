      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Invalid supplier ID
          schema:
            type: string
        "404":
          description: Supplier not found
          schema:
            type: string
        "409":
          description: 'Conflict: cannot delete supplier with associated purchases'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a supplier
      tags:
      - suppliers
    get:
      description: Retrieves detailed information of a single supplier. Requires the
        ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Supplier ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Supplier'
        "400":
          description: Invalid supplier ID
          schema:
            type: string
        "404":
          description: Supplier not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get a supplier by ID
      tags:
      - suppliers
    put:
      consumes:
      - application/json
      description: Modifies an existing supplier's details. Requires the ayurami-admin
        role.
      parameters:
      - description: Supplier ID
        in: path
        name: id
        required: true
        type: integer
      - description: Supplier Update Payload
        in: body
        name: supplier
        required: true
        schema:
          $ref: '#/definitions/service.SupplierRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: 'Bad request: invalid payload or missing fields'
          schema:
            type: string
        "404":
          description: Supplier not found
          schema:
            type: string
        "409":
          description: 'Conflict: tax ID already registered'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a supplier
      tags:
      - suppliers
  /api/v1/units-of-measure:
    get:
      description: Retrieves all available units of measure ordered by name. Requires
        the ayurami-admin or ayurami-salesperson role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UnitOfMeasure'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List units of measure
      tags:
      - units-of-measure
  /api/v1/users:
    get:
      description: Retrieves all registered users ordered alphabetically by name.
        Requires the ayurami-admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.User'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Creates a new system user (admin or salesperson) with a secure
        hashed password. Requires the ayurami-admin role.
      parameters:
      - description: User Creation Payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/service.UserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new user
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      description: Deletes a user from the system. Requires the ayurami-admin role.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: Bad request
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - users
    get:
      description: Retrieves detailed user profile information. Requires the ayurami-admin
        role.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "400":
          description: Bad request
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Updates a user's role, password, fullName, or status. Requires
        the ayurami-admin role.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      - description: User Update Payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/service.UserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
