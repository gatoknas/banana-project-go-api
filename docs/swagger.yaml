basePath: /
definitions:
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.LoginResponse:
    properties:
      refreshToken:
        type: string
      token:
        type: string
    type: object
  handlers.MessageResponse:
    properties:
      id:
        type: integer
      message:
        type: string
      status:
        type: string
    type: object
  handlers.RefreshRequest:
    properties:
      refreshToken:
        type: string
    type: object
  handlers.SaleResponse:
    properties:
      message:
        type: string
      saleId:
        type: integer
      status:
        type: string
    type: object
  handlers.SyncResponse:
    properties:
      message:
        type: string
      result:
        $ref: '#/definitions/service.SyncResult'
      status:
        type: string
    type: object
  models.Category:
    properties:
      createdAt:
        description: 'CreatedAt is the timestamp when the category was created (Spanish:
          Creado En).'
        type: string
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      name:
        description: 'Name is the category name (Spanish: Nombre).'
        type: string
    type: object
  models.CategoryEntry:
    properties:
      categoryId:
        type: integer
      categoryName:
        type: string
      count:
        type: integer
      totalRevenue:
        type: number
    type: object
  models.DailyRevenueBucket:
    properties:
      amount:
        type: number
      count:
        type: integer
      date:
        type: string
    type: object
  models.DashboardKPIs:
    properties:
      activeUsers:
        type: integer
      averageTicket:
        type: number
      lowStockProducts:
        type: integer
      monthPurchasesTotal:
        type: number
      todayRevenue:
        type: number
      todayTransactions:
        type: integer
    type: object
  models.DashboardStats:
    properties:
      categoryBreakdown:
        items:
          $ref: '#/definitions/models.CategoryEntry'
        type: array
      inventoryAlerts:
        items:
          $ref: '#/definitions/models.InventoryAlertEntry'
        type: array
      kpis:
        $ref: '#/definitions/models.DashboardKPIs'
      paymentMethodBreakdown:
        items:
          $ref: '#/definitions/models.PaymentMethodEntry'
        type: array
      purchasesVsSales:
        items:
          $ref: '#/definitions/models.PurchasesVsSalesEntry'
        type: array
      salesTimeline:
        items:
          $ref: '#/definitions/models.SalesTimelineEntry'
        type: array
      topProducts:
        items:
          $ref: '#/definitions/models.TopProductEntry'
        type: array
    type: object
  models.EmailReceipt:
    properties:
      amount:
        description: 'Amount is the payment amount (Spanish: Monto).'
        type: number
      bank:
        description: 'Bank is the originating bank (Spanish: Banco).'
        type: string
      createdAt:
        description: 'CreatedAt is the ingestion timestamp (Spanish: Creado En).'
        type: string
      currency:
        description: 'Currency is the ISO currency code (Spanish: Moneda).'
        type: string
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      messageId:
        description: 'MessageID is the source email message id; unique and used for
          idempotent ingestion (Spanish: ID Mensaje).'
        type: string
      parseError:
        description: 'ParseError holds the parsing failure message when Status is
          error (Spanish: Error de Parseo).'
        type: string
      payer:
        description: 'Payer is the person/entity that paid (Spanish: Pagador).'
        type: string
      paymentMethod:
        description: 'PaymentMethod is the payment method label (e.g. QR Negocios
          Bre-B) (Spanish: Método de Pago).'
        type: string
      receivedAt:
        description: 'ReceivedAt is when the inbox received the email (Spanish: Recibido
          En).'
        type: string
      reference:
        description: 'Reference is the bank reference code (Spanish: Referencia).'
        type: string
      sender:
        description: 'Sender is the email sender address (Spanish: Remitente).'
        type: string
      status:
        description: 'Status is the ingestion status: imported or error (Spanish:
          Estado).'
        type: string
      subject:
        description: 'Subject is the email subject line (Spanish: Asunto).'
        type: string
      transactionDate:
        description: 'TransactionDate is the date/time of the payment as reported
          in the receipt body (Spanish: Fecha de Transacción).'
        type: string
      transactionNumber:
        description: 'TransactionNumber is the unique transaction id from the bank
          (Spanish: Número de Transacción).'
        type: string
    type: object
  models.InventoryAlertEntry:
    properties:
      currentStock:
        type: number
      minimumStock:
        type: number
      productId:
        type: integer
      productName:
        type: string
      unit:
        type: string
    type: object
  models.PaginatedSalesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.Sale'
        type: array
      pagination:
        $ref: '#/definitions/models.SalePagination'
      summary:
        $ref: '#/definitions/models.SaleSummaryStats'
    type: object
  models.PaymentMethodEntry:
    properties:
      amount:
        type: number
      count:
        type: integer
      method:
        type: string
    type: object
  models.Product:
    properties:
      averageCost:
        description: 'AverageCost is the dynamic weighted cost from purchases (Spanish:
          Costo Promedio).'
        type: number
      categoryId:
        description: 'CategoryID is the reference ID of the category (Spanish: ID
          Categoría).'
        type: integer
      categoryName:
        description: 'CategoryName is the name of the category (Spanish: Nombre Categoría).'
        type: string
      createdAt:
        description: 'CreatedAt is the creation timestamp (Spanish: Creado En).'
        type: string
      currentStock:
        description: 'CurrentStock is the real-time stock from inventories (Spanish:
          Stock Actual).'
        type: number
      description:
        description: 'Description is the optional product description (Spanish: Descripción).'
        type: string
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      isForSale:
        description: 'IsForSale defines if it can be sold in the POS (Spanish: Es
          Para Venta).'
        type: boolean
      maximumStock:
        description: 'MaximumStock is the maximum storage limit from inventories (Spanish:
          Stock Máximo).'
        type: number
      minimumStock:
        description: 'MinimumStock is the minimum reorder threshold from inventories
          (Spanish: Stock Mínimo).'
        type: number
      name:
        description: 'Name is the commercial name (Spanish: Nombre).'
        type: string
      requiresRecipe:
        description: 'RequiresRecipe defines if it deducts child recipe items upon
          sale (Spanish: Requiere Receta).'
        type: boolean
      sellPrice:
        description: 'SellPrice is the price for customers, can be 0 for pure ingredients
          (Spanish: Precio de Venta).'
        type: number
      unitAbbreviation:
        description: 'UnitAbbreviation is the abbreviation of the unit of measure
          (Spanish: Abreviatura Unidad).'
        type: string
      unitName:
        description: 'UnitName is the name of the unit of measure (Spanish: Nombre
          Unidad).'
        type: string
      unitOfMeasureId:
        description: 'UnitOfMeasureID is the reference ID of the unit of measure (Spanish:
          ID Unidad de Medida).'
        type: integer
      updatedAt:
        description: 'UpdatedAt is the last modification timestamp (Spanish: Actualizado
          En).'
        type: string
    type: object
  models.Purchase:
    properties:
      createdAt:
        description: 'CreatedAt is the creation timestamp (Spanish: Creado En).'
        type: string
      details:
        description: 'Details is the list of line items in this purchase (Spanish:
          Detalles de Compra).'
        items:
          $ref: '#/definitions/models.PurchaseDetail'
        type: array
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      invoiceNumber:
        description: 'InvoiceNumber is the provider''s physical invoice ID (Spanish:
          Número de Factura).'
        type: string
      notes:
        description: 'Notes is any additional comment or observation (Spanish: Observaciones).'
        type: string
      purchaseDate:
        description: 'PurchaseDate is when the transaction occurred (Spanish: Fecha
          de Compra).'
        type: string
      supplierId:
        description: 'SupplierID is the reference to the supplying company (Spanish:
          ID Proveedor).'
        type: integer
      supplierName:
        description: 'SupplierName is the company name of the supplier (Spanish: Nombre
          Proveedor).'
        type: string
      totalAmount:
        description: 'TotalAmount is the sum paid for the purchase (Spanish: Total
          de la Compra).'
        type: number
    type: object
  models.PurchaseDetail:
    properties:
      baseQuantity:
        description: 'BaseQuantity is the effective quantity added to inventory stock
          (Spanish: Cantidad Base).'
        type: number
      conversionFactor:
        description: 'ConversionFactor is the ratio of base units per purchase unit
          (Spanish: Factor de Conversión).'
        type: number
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      productId:
        description: 'ProductID is the bought item or ingredient product ID (Spanish:
          ID Producto).'
        type: integer
      productName:
        description: 'ProductName is the name of the bought product (Spanish: Nombre
          Producto).'
        type: string
      purchaseId:
        description: 'PurchaseID is the parent purchase header ID (Spanish: ID Compra).'
        type: integer
      purchaseUnitId:
        description: 'PurchaseUnitID is the unit of measure used in the purchase (Spanish:
          ID Unidad de Compra).'
        type: integer
      purchaseUnitName:
        description: 'PurchaseUnitName is the name of the purchase unit (Spanish:
          Unidad de Compra).'
        type: string
      quantityPurchased:
        description: 'QuantityPurchased is the quantity bought in the purchase unit
          (Spanish: Cantidad Comprada).'
        type: number
      subtotal:
        description: 'Subtotal is the total price for this line item (Spanish: Subtotal).'
        type: number
      unitCost:
        description: 'UnitCost is the net cost paid per unit in this purchase (Spanish:
          Costo Unitario).'
        type: number
    type: object
  models.PurchasesVsSalesEntry:
    properties:
      month:
        type: string
      purchases:
        type: number
      sales:
        type: number
    type: object
  models.RevenueSummary:
    properties:
      averageTicket:
        type: number
      currency:
        type: string
      growthPercentage:
        type: number
      previousPeriodRevenue:
        type: number
      timeline:
        items:
          $ref: '#/definitions/models.DailyRevenueBucket'
        type: array
      totalRevenue:
        type: number
      transactionCount:
        type: integer
    type: object
  models.Sale:
    properties:
      createdAt:
        description: 'CreatedAt is the creation timestamp (Spanish: Creado En).'
        type: string
      details:
        description: 'Details is the list of line items in this sale (Spanish: Detalles
          de Venta).'
        items:
          $ref: '#/definitions/models.SaleDetail'
        type: array
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      itemsCount:
        description: 'ItemsCount is the total number of distinct line items in the
          sale (Spanish: Cantidad de Ítems).'
        type: integer
      paymentMethod:
        description: 'PaymentMethod is the checkout method (e.g. Cash, Card) (Spanish:
          Método de Pago).'
        type: string
      saleDate:
        description: 'SaleDate is when the checkout occurred (Spanish: Fecha de Venta).'
        type: string
      totalAmount:
        description: 'TotalAmount is the final total net amount received (Spanish:
          Total de la Venta).'
        type: number
      userId:
        description: 'UserID is the reference ID of the cashier who sold it (Spanish:
          ID Usuario).'
        type: integer
      userName:
        description: 'UserName is the name of the cashier / user who registered the
          sale (Spanish: Nombre Usuario).'
        type: string
    type: object
  models.SaleDetail:
    properties:
      historicalUnitPrice:
        description: 'HistoricalUnitPrice is the unit price at the time of sale (Spanish:
          Precio Unitario Histórico).'
        type: number
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      productId:
        description: 'ProductID is the principal sold product ID (Spanish: ID Producto).'
        type: integer
      productName:
        description: 'ProductName is the name of the sold product (Spanish: Nombre
          Producto).'
        type: string
      quantity:
        description: 'Quantity is the amount sold, supports decimals for weighed items
          (Spanish: Cantidad).'
        type: number
      saleId:
        description: 'SaleID is the parent sale header ID (Spanish: ID Venta).'
        type: integer
      subtotal:
        description: 'Subtotal is quantity * HistoricalUnitPrice (Spanish: Subtotal).'
        type: number
    type: object
  models.SalePagination:
    properties:
      page:
        type: integer
      pageSize:
        type: integer
      totalItems:
        type: integer
      totalPages:
        type: integer
    type: object
  models.SaleSummaryStats:
    properties:
      totalAmount:
        type: number
      totalCount:
        type: integer
    type: object
  models.SalesTimelineEntry:
    properties:
      count:
        type: integer
      date:
        type: string
      revenue:
        type: number
    type: object
  models.Supplier:
    properties:
      companyName:
        description: 'CompanyName is the legal name of the business (Spanish: Razón
          Social).'
        type: string
      contactName:
        description: 'ContactName is the provider contact representative (Spanish:
          Nombre de Contacto).'
        type: string
      createdAt:
        description: 'CreatedAt is the timestamp when the supplier was registered
          (Spanish: Creado En).'
        type: string
      description:
        description: 'Description represents additional notes or details about the
          supplier (Spanish: Descripción / Notas).'
        type: string
      email:
        description: 'Email is the contact email address (Spanish: Correo Electrónico).'
        type: string
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      phone:
        description: 'Phone is the contact number (Spanish: Teléfono).'
        type: string
      taxId:
        description: 'TaxID is the tax identifier (e.g. NIT/Cédula) (Spanish: NIT
          o Cédula).'
        type: string
    type: object
  models.TopProductEntry:
    properties:
      productId:
        type: integer
      productName:
        type: string
      totalQuantity:
        type: number
      totalRevenue:
        type: number
    type: object
  models.UnitOfMeasure:
    properties:
      abbreviation:
        description: 'Abbreviation is the short code representing the unit (Spanish:
          Abreviatura).'
        type: string
      createdAt:
        description: 'CreatedAt is the timestamp when the unit was created (Spanish:
          Creado En).'
        type: string
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      name:
        description: 'Name is the name of the unit (Spanish: Nombre).'
        type: string
    type: object
  models.User:
    properties:
      createdAt:
        description: 'CreatedAt is the registration timestamp (Spanish: Creado En).'
        type: string
      fullName:
        description: 'FullName is the operator''s real name (Spanish: Nombre Completo).'
        type: string
      id:
        description: 'ID is the unique identifier (Spanish: ID).'
        type: integer
      isActive:
        description: 'IsActive defines if the user account is enabled (Spanish: Activo).'
        type: boolean
      role:
        description: 'Role is the authorization role (e.g. Administrator, Cajero)
          (Spanish: Rol).'
        type: string
      username:
        description: 'Username is the login identifier (Spanish: Nombre de Usuario).'
        type: string
    type: object
  service.EmailReceiptSyncRequest:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  service.ProductRequest:
    properties:
      averageCost:
        type: number
      categoryId:
        type: integer
      description:
        type: string
      isForSale:
        type: boolean
      name:
        type: string
      requiresRecipe:
        type: boolean
      sellPrice:
        type: number
      unitOfMeasureId:
        type: integer
    type: object
  service.PurchaseItemRequest:
    properties:
      conversionFactor:
        type: number
      productId:
        type: integer
      purchaseUnitId:
        type: integer
      quantityPurchased:
        type: number
      unitCost:
        type: number
    type: object
  service.PurchaseRequest:
    properties:
      invoiceNumber:
        type: string
      items:
        items:
          $ref: '#/definitions/service.PurchaseItemRequest'
        type: array
      notes:
        type: string
      purchaseDate:
        type: string
      supplierId:
        type: integer
    type: object
  service.SaleItemRequest:
    properties:
      productId:
        type: integer
      quantity:
        type: number
    type: object
  service.SaleRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/service.SaleItemRequest'
        type: array
      paymentMethod:
        type: string
      totalAmount:
        type: number
      userId:
        type: integer
    type: object
  service.SupplierRequest:
    properties:
      companyName:
        type: string
      contactName:
        type: string
      description:
        type: string
      email:
        type: string
      phone:
        type: string
      taxId:
        type: string
    type: object
  service.SyncResult:
    properties:
      errors:
        type: integer
      fetched:
        type: integer
      imported:
        type: integer
      skipped:
        type: integer
    type: object
  service.UserRequest:
    properties:
      fullName:
        type: string
      isActive:
        type: boolean
      password:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
host: localhost:8082
info:
  contact: {}
  description: This is the API server for Banana Project.
  title: Banana Project Go REST API
  version: "1.0"
paths:
  /api/v1/categories:
    get:
      description: Retrieves all product categories ordered by ID. Requires the ayurami-admin
        or ayurami-salesperson role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Category'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List product categories
      tags:
      - categories
  /api/v1/dashboard/stats:
    get:
      description: Returns executive KPIs, sales timeline, payment method breakdown,
        top products, category distribution, purchases vs sales, and inventory stock
        alerts. Requires the ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Start date filter (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: End date filter (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DashboardStats'
        "400":
          description: 'Bad request: invalid date format'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get aggregated dashboard stats
      tags:
      - dashboard
  /api/v1/email-receipts:
    get:
      description: Retrieves stored bank receipts, optionally filtered by a received_at
        date range. Requires the ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Start date (YYYY-MM-DD, inclusive)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD, inclusive)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.EmailReceipt'
            type: array
        "400":
          description: 'Bad request: invalid date'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List stored email receipts
      tags:
      - email-receipts
  /api/v1/email-receipts/summary:
    get:
      description: Calculates total revenue, transaction counts, average ticket, period-over-period
        growth, and daily timeline buckets from email receipts. Requires ayurami-admin
        or ayurami-salesperson role.
      parameters:
      - description: Start date (YYYY-MM-DD, inclusive)
        in: query
        name: from
        type: string
      - description: End date (YYYY-MM-DD, inclusive)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.RevenueSummary'
        "400":
          description: 'Bad request: invalid date or date range'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get revenue summary and analytics
      tags:
      - email-receipts
  /api/v1/email-receipts/sync:
    post:
      consumes:
      - application/json
      description: Reads receipt registers from the configured Google Sheets document
        in chunks and stores new sale details. Requires the ayurami-admin role.
      parameters:
      - description: Optional date range (from/to as YYYY-MM-DD)
        in: body
        name: range
        schema:
          $ref: '#/definitions/service.EmailReceiptSyncRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SyncResponse'
        "400":
          description: 'Bad request: invalid JSON payload or date range'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Sync bank receipts from Google Sheets
      tags:
      - email-receipts
  /api/v1/products:
    get:
      description: Retrieves all products ordered alphabetically by name. Requires
        the ayurami-admin or ayurami-salesperson role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Product'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Creates a new product in the catalog and initializes its inventory
        to zero. Requires the ayurami-admin role.
      parameters:
      - description: Product Creation Payload
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/service.ProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: 'Bad request: invalid JSON payload or missing name'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new product
      tags:
      - products
  /api/v1/products/{id}:
    delete:
      description: Deletes a product along with all associated inventory, recipe entries,
        and allowed additions. Requires the ayurami-admin role.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: 'Bad request: invalid ID'
          schema:
            type: string
        "404":
          description: Product not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Delete a product
      tags:
      - products
    get:
      description: Retrieves detailed information of a single product. Requires the
        ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Product'
        "400":
          description: 'Bad request: invalid product ID'
          schema:
            type: string
        "404":
          description: Product not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get a product by ID
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Updates an existing product's fields. Requires the ayurami-admin
        role.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      - description: Product Update Payload
        in: body
        name: product
        required: true
        schema:
          $ref: '#/definitions/service.ProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: 'Bad request: invalid ID or invalid JSON payload or missing
            name'
          schema:
            type: string
        "404":
          description: Product not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a product
      tags:
      - products
  /api/v1/purchases:
    get:
      description: Retrieves purchase orders ordered by date descending with optional
        supplier and date range filtering. Requires the ayurami-admin or ayurami-salesperson
        role.
      parameters:
      - description: Filter by supplier ID
        in: query
        name: supplierId
        type: integer
      - description: Start date filter (YYYY-MM-DD or RFC3339)
        in: query
        name: fromDate
        type: string
      - description: End date filter (YYYY-MM-DD or RFC3339)
        in: query
        name: toDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Purchase'
            type: array
        "400":
          description: 'Bad request: invalid filter parameters'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List purchase orders
      tags:
      - purchases
    post:
      consumes:
      - application/json
      description: Registers a restock invoice, inserts purchase details, atomically
        increments physical inventory stock, and recalculates product weighted average
        cost (PMP). Requires the ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Purchase Payload
        in: body
        name: purchase
        required: true
        schema:
          $ref: '#/definitions/service.PurchaseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: 'Bad request: invalid payload or validation error'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new purchase order / restock
      tags:
      - purchases
  /api/v1/purchases/{id}:
    get:
      description: Retrieves a single purchase header and its associated item line
        details. Requires the ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Purchase ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Purchase'
        "400":
          description: Invalid purchase ID
          schema:
            type: string
        "404":
          description: Purchase not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get purchase order details
      tags:
      - purchases
    put:
      consumes:
      - application/json
      description: Atomically reverts prior line stock and weighted average cost contributions,
        deletes previous items, updates header metadata, inserts new items, applies
        new inventory stock increments and recomputes weighted average cost (PMP).
        Requires the ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Purchase ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated Purchase Payload
        in: body
        name: purchase
        required: true
        schema:
          $ref: '#/definitions/service.PurchaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: 'Bad request: invalid payload or validation error'
          schema:
            type: string
        "404":
          description: Purchase not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update an existing purchase order
      tags:
      - purchases
  /api/v1/sales:
    get:
      description: Retrieves a paginated list of sales with optional filtering by
        date range, payment method, and cashier. Requires the ayurami-admin or ayurami-salesperson
        role.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 10, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Start date filter (YYYY-MM-DD or RFC3339)
        in: query
        name: fromDate
        type: string
      - description: End date filter (YYYY-MM-DD or RFC3339)
        in: query
        name: toDate
        type: string
      - description: Filter by payment method (e.g. Cash, Card)
        in: query
        name: paymentMethod
        type: string
      - description: Filter by cashier user ID
        in: query
        name: userId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PaginatedSalesResponse'
        "400":
          description: 'Bad request: invalid filter parameters'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List sales transactions
      tags:
      - sales
    post:
      consumes:
      - application/json
      description: Registers a new sale, deducts product or recipe ingredient inventory,
        and records details. Requires the ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Sale Creation Payload
        in: body
        name: sale
        required: true
        schema:
          $ref: '#/definitions/service.SaleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.SaleResponse'
        "400":
          description: 'Bad request: invalid JSON payload or sale must have at least
            one item'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new sale
      tags:
      - sales
  /api/v1/sales/{id}:
    get:
      description: Retrieves full sale ticket details including itemized products
        and prices. Requires the ayurami-admin or ayurami-salesperson role.
      parameters:
      - description: Sale ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Sale'
        "400":
          description: 'Bad request: invalid sale ID'
          schema:
            type: string
        "404":
          description: Sale not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get sale details by ID
      tags:
      - sales
  /api/v1/suppliers:
    get:
      description: Retrieves all registered suppliers with optional search filtering
        by company name, tax ID, or contact. Requires the ayurami-admin or ayurami-salesperson
        role.
      parameters:
      - description: Search filter query
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Supplier'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List suppliers
      tags:
      - suppliers
    post:
      consumes:
      - application/json
      description: Registers a new goods or ingredients provider. Requires the ayurami-admin
        role.
      parameters:
      - description: Supplier Creation Payload
        in: body
        name: supplier
        required: true
        schema:
          $ref: '#/definitions/service.SupplierRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.MessageResponse'
        "400":
          description: 'Bad request: invalid payload or missing fields'
          schema:
            type: string
        "409":
          description: 'Conflict: tax ID already registered'
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Create a new supplier
      tags:
      - suppliers
  /api/v1/suppliers/{id}:
    delete:
      description: Deletes a supplier by ID if they have no associated purchases.
